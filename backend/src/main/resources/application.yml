spring:
  application:
    name: pantry-tracker

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}

  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Pantry Tracker <onboarding@resend.dev>}

  digest:
    cron: ${DIGEST_CRON:0 0 7 * * *}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  auth:
    # HttpOnly refresh cookie. Secure MUST be true in production (HTTPS);
    # it is off by default so local development over plain HTTP still works.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # Lax works for localhost and same-site production topologies. If the
    # frontend and API are on different registrable domains, use None
    # (requires AUTH_COOKIE_SECURE=true).
    cookie-samesite: ${AUTH_COOKIE_SAMESITE:Lax}

logging:
  level:
    com.pantrytracker: INFO